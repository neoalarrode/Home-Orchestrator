<!DOCTYPE html><html><head><meta charset=utf-8></head><body>
<iframe id="svc" style="width:400px;height:800px;border:0"></iframe>
<script>
window.__STREAM=[]; window.__ACKS=0;
window.addEventListener("message", function(e){
  var d=e.data; if(!d) return;
  try{ window.__STREAM.push(typeof d==="object"?d:{raw:String(d)}); }catch(err){}
  // ACK de sync callbacks (hace de "vista" que responde) -> desbloquea el pipeline de render
  try{ if(d.$syncCallbackKey && e.source){ window.__ACKS++; e.source.postMessage({$applyCallbackKey:d.$syncCallbackKey, args:[{}]}, "*"); } }catch(err){}
});
window.__startSvc=function(qs){ var f=document.getElementById("svc"); f.src="/service.html"+qs; return new Promise(function(res){ f.onload=function(){res(true);}; }); };
</script>
</body></html>
